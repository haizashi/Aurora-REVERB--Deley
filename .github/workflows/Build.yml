name: Build Aurora VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows, extra: "" }
          - { os: macos-latest,   name: macOS,   extra: "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" }
          - { os: ubuntu-latest,  name: Linux,   extra: "" }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DAURORA_COPY_AFTER_BUILD=OFF "${{ matrix.extra }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-VST3-${{ matrix.name }}
          path: build/Aurora_artefacts/Release/VST3/
